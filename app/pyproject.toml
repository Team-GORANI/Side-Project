[project]
name = "backend-gorani-side-project"
version = "0.1.0"
description = "Backend Gorani Side Project"
authors = [
    {name = "Taehan Kim", email = "taehan5479@gmail.com"},
    {name = "Namgyu-Youn", email = "yynk2012@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<3.14"

[tool.poetry]
name = "backend-gorani-side-project"
version = "0.1.0"
description = "Backend Gorani Side Project"
authors = [
    "Taehan Kim <taehan5479@gmail.com>",
    "Namgyu-Youn <yynk2012@gmail.com>"
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
fastapi = "^0.141.1"
sqlalchemy = "^2.0.36"
openai = "^1.58.1"
uvicorn = "^0.34.0"
ultralytics = {version = "^8.3.54", extras = ["cpu"]}
numpy = "^1.26.4"
python-multipart = "^0.0.32"
torch = "^2.13.0"
torchvision = "^0.28.0"
python-dotenv = ">=1.2.2"

# Security floors for transitive dependencies (Dependabot alerts).
# Keep until the direct dependents raise their own bounds.
filelock = ">=3.20.3"
fonttools = ">=4.60.2"
h11 = ">=0.16.0"
idna = ">=3.15"
jinja2 = ">=3.1.6"
pillow = ">=12.3.0"
requests = ">=2.33.0"
setuptools = ">=83.0.0"
starlette = ">=1.3.1"
urllib3 = ">=2.7.0"
wheel = ">=0.46.2"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"